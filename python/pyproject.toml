[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-analytics"
version = "0.1.0"
description = "Read-only consumer for Atlas analytics exports"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
atlas-analytics = "atlas_analytics.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
