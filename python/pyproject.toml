[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-local-content"
version = "0.6.0"
description = "Local content processing for Atlas Desktop"
requires-python = ">=3.11"
dependencies = ["pandas==3.0.1", "pypdf==6.14.2"]

[tool.setuptools.packages.find]
where = ["src"]
