interface:
  display_name: "Atlas File Governance"
  short_description: "Govern projects, attachments, spreadsheets, writes, and recovery"
  default_prompt: "Use $atlas-file-governance for this local project, attachment, spreadsheet, cross-project context, durable output, file change, or recovery task. Let Atlas compute bounded local facts and enforce the supported workflow; return one concise factual receipt."

policy:
  allow_implicit_invocation: true
